services:
  - type: web
    name: budgetbuddy-api
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: DATABASE_URL
        fromDatabase:
          name: budgetbuddy-production-db
          property: connectionString
      - key: CORS_ORIGINS
        fromService:
          name: budgetbuddy-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: budgetbuddy-frontend
    runtime: static
    branch: main
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        fromService:
          name: budgetbuddy-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: budgetbuddy-production-db
    postgresMajorVersion: "18"
    plan: free
    region: oregon
